[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motifminer"
version = "0.1.0"
description = "Infer candidate ligand-binding motifs from protein MSAs"
requires-python = ">=3.10"

[project.scripts]
motifminer = "motifminer.cli:main"

[tool.setuptools]
packages = ["motifminer"]

